# GitHub Releaseの公開をトリガーに、本番用イメージを GitHub Container Registry へ公開する。
# 認証は GITHUB_TOKEN（packages: write）だけで足り、PATは不要。
#   ghcr.io/froggugugugu/triplan-web     nginx＋クライアント（docker/client.Dockerfile）
#   ghcr.io/froggugugugu/triplan-server  APIサーバー（docker/server.Dockerfile）
name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - image: triplan-web
            dockerfile: docker/client.Dockerfile
          - image: triplan-server
            dockerfile: docker/server.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
