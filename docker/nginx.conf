# 本番セルフホスト構成のnginx設定（docker/client.Dockerfileが使用）
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip（@fastify/compress相当の圧縮を静的配信側でも行う）
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA: 実ファイルに無いパスはindex.htmlへ（React Routerのクライアントルーティング）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ビルド済みアセットはファイル名にハッシュが付くため長期キャッシュしてよい
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # APIは同一オリジンのままコンテナ内ネットワークのAPIサーバーへ中継する
  location /api/ {
    proxy_pass http://server:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
